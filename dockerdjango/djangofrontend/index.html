<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django + Docker App</title>
    <style>
        /* Modern CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .status-badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        #api-response {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Django Backend Data</h1>
        <div id="status" class="status-badge">Connecting...</div>
        <p id="api-response">
            <div class="loader" id="loader"></div>
        </p>
    </div>

    <script>
        const responseText = document.getElementById('api-response');
        const statusBadge = document.getElementById('status');
        const loader = document.getElementById('loader');

        // Note: 'localhost' works for local testing. 
        // When you Dockerize, this is the URL your browser uses to find the backend.
        fetch('http://localhost:8000/api/data/')
            .then(response => response.json())
            .then(data => {
                loader.style.display = 'none';
                statusBadge.innerText = data.status;
                statusBadge.style.backgroundColor = "#e3f2fd";
                statusBadge.style.color = "#1976d2";
                responseText.innerText = data.message;
            })
            .catch(err => {
                loader.style.display = 'none';
                statusBadge.innerText = "Offline";
                statusBadge.style.backgroundColor = "#ffebee";
                statusBadge.style.color = "#c62828";
                responseText.innerText = "Could not connect to the Django server.";
                console.error("Fetch error:", err);
            });
    </script>
</body>
</html>
